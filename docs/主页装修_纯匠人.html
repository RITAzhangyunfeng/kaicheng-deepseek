<!DOCTYPE html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><title>开成高俪 · 纯匠人主页装修</title><style>body{background:#f7f3ee;font-family:-apple-system,'PingFang SC',sans-serif;color:#2b2320;margin:0;padding:24px}
.wrap{max-width:1100px;margin:0 auto}h1{color:#7a1f1a;font-family:'Songti SC',serif;border-bottom:3px solid #7a1f1a;padding-bottom:12px}
h2{color:#7a1f1a;border-left:5px solid #c9a227;padding-left:10px;margin-top:32px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:#fff;border:1px solid #e8ddd2;border-radius:10px;padding:10px;text-align:center}
.card img{width:100%;border-radius:6px;cursor:zoom-in}
.cap{font-size:13px;color:#4a3a28;margin-top:8px}
.note{background:#fdf7e8;border:1px solid #e8d8b8;padding:12px 16px;border-radius:6px;margin:14px 0;font-size:14px}</style></head><body><div class='wrap'>
<h1>🎨 开成高俪 · 纯匠人 · 主页装修</h1>
<p class='note'>图片成品页，点图可放大。</p>
<h2>🖼️ 纯匠人封面</h2><div class='grid'><div class='card'><img src='assets_home/库_泡茶.jpg' onclick=window.open(this.src)><div class='cap'>泡茶</div></div><div class='card'><img src='assets_home/库_参酒.jpg' onclick=window.open(this.src)><div class='cap'>参酒</div></div></div>
<h2>🌌 主页背景</h2><div class='grid'><div class='card'><img src='assets_home/库_参片.jpg' onclick=window.open(this.src)><div class='cap'>参片</div></div><div class='card'><img src='assets_home/库_泡蜜.jpg' onclick=window.open(this.src)><div class='cap'>泡蜜</div></div></div>
<h2>📐 封面模板</h2><div class='grid'><div class='card'><img src='assets_home/库_炖鸡.jpg' onclick=window.open(this.src)><div class='cap'>炖鸡</div></div><div class='card'><img src='assets_home/库_产地.jpg' onclick=window.open(this.src)><div class='cap'>产地</div></div></div>
</div></body></html>
